<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Tiny Ski</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a2a34; display:flex; justify-content:center; align-items:center; font-family:'Segoe UI',sans-serif; overflow:hidden; height:100vh; }
  #game-wrap { position:relative; border:3px solid #3b5a68; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  canvas { display:block; background:#f0f8ff; image-rendering: pixelated; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(0,0,0,.55); z-index:1; font-size:28px; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.4); }
  #overlay h2 { margin-bottom:12px; font-size:42px; letter-spacing:2px; }
  #overlay p { font-size:16px; line-height:1.6; max-width:340px; text-align:center; color:#e0e8f0; }
  #overlay .btn-row { margin-top:24px; display:flex; gap:12px; }
  #overlay button { padding:10px 26px; font-size:16px; border:none; border-radius:8px; cursor:pointer; background:#3b5a68; color:#fff; transition:background .2s; }
  #overlay button:hover { background:#5a8a9e; }
  #hud { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.65); color:#fff; padding:8px 14px; border-radius:6px; font-size:14px; z-index:2; line-height:1.6; pointer-events:none; }

  /* ── Scaling & Fullscreen ── */
  #game-wrap {
    transform-origin: center center;
    will-change: transform;
  }

  /* When in fullscreen, the wrap IS the viewport — no scale needed */
  body.fullscreen-active #game-wrap {
    transform: none;
  }

  /* Fullscreen button styling */
  #fullscreen-btn {
    padding: 10px 26px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #3b5a68;
    color: #fff;
    transition: background .2s;
  }
  #fullscreen-btn:hover {
    background: #5a8a9e;
  }
  #fullscreen-btn.hidden {
    display: none;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="480" height="720"></canvas>
  <div id="overlay">
    <h2>⛷️ Tiny Ski</h2>
    <p>W / S &mdash; slow down / speed up<br/>
       A / D &mdash; steer left / right<br/>
       🎮 Gamepad: Left stick / D-pad to steer and control speed<br/>
       Avoid trees, rocks &amp; snowmen!<br/><br/>
       <strong>Press a Key or Button to Begin</strong></p>
    <div class="btn-row">
      <button id="start-btn">Start Skiing</button>
      <button id="fullscreen-btn" title="Toggle Fullscreen">[FS]</button>
    </div>
  </div>
</div>
<!-- HUD outside the scaled container so it stays readable at any scale -->
<div id="hud">
  <div>Score: <span id="score">0</span></div>
  <div>Distance: <span id="distance">0</span>m</div>
  <div>Speed: <span id="speed">2.0</span></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════
const CANVAS_W = 480, CANVAS_H = 720;
const TILE = 16;
const PPM = 60; // pixels per meter — scale for distance calculation
const PLAYER_Y = Math.floor(CANVAS_H / 2);
const YETI_THRESHOLD = 500;           // meters before yeti appears
const YETI_SPEED_BASE = 2.4;
const YETI_SPEED_MAX  = 3.2;

// ── Player speed constants ──
const PLAYER_BASE_SPEED = 2.0;
const PLAYER_MIN_SPEED  = 1.25;
const PLAYER_MAX_SPEED  = 3.5;
const PLAYER_STEER_SPEED = 1.0;
const PLAYER_SPEED_RAMP = 0.02;  // speed change per frame
const OBSTACLE_RADIUS = (TILE + 2) / 2;  // collision radius for obstacles (matches 18x18 draw size)
const PLAYER_RADIUS   = TILE * 0.45;
const YETI_RADIUS     = (TILE + 2) / 2;  // yeti collision radius (matches obstacle draw size)

// ═══════════════════════════════════════════════════════════
//  TILE PATHS
// ═══════════════════════════════════════════════════════════
const TILE_PATHS = {
  // Terrain (6 tiles matching actual files)
  snowA:  'assets/Tiles/terrain_textures/tile_0000.png',
  snowB:  'assets/Tiles/terrain_textures/tile_0005.png',
  iceA:   'assets/Tiles/terrain_textures/tile_0013.png',
  snowC:  'assets/Tiles/terrain_textures/tile_0016.png',
  snowD:  'assets/Tiles/terrain_textures/tile_0049.png',
  iceB:   'assets/Tiles/terrain_textures/tile_0052.png',
  // Player
  playerA: 'assets/Tiles/player_sprite/female/tile_0082.png',
  playerB: 'assets/Tiles/player_sprite/female/tile_0083.png',
  // Yeti
  yetiA:   'assets/Tiles/yeti_sprite/tile_0078.png',
  yetiB:   'assets/Tiles/yeti_sprite/tile_0079.png',
  yetiC:   'assets/Tiles/yeti_sprite/tile_0080.png',
  // Collision objects
  stumpA:  'assets/Tiles/collision_objects/tile_0006.png',
  bushA:   'assets/Tiles/collision_objects/tile_0019.png',
  bushB:   'assets/Tiles/collision_objects/tile_0031.png',
  bushC:   'assets/Tiles/collision_objects/tile_0030.png',
  snowman: 'assets/Tiles/collision_objects/tile_0069.png',
  rock:    'assets/Tiles/collision_objects/tile_0081.png',
  // Boundary markers (not used as random obstacles)
  boundaryRight: 'assets/Tiles/collision_objects/tile_0032.png',
  boundaryLeft:  'assets/Tiles/collision_objects/tile_0033.png',
};

// ═══════════════════════════════════════════════════════════
//  CANVAS & DOM
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const overlay   = document.getElementById('overlay');
const hudScore  = document.getElementById('score');
const hudDist   = document.getElementById('distance');
const hudSpeed  = document.getElementById('speed');

// ═══════════════════════════════════════════════════════════
//  TILE LOADING
// ═══════════════════════════════════════════════════════════
const tiles = {};
let tilesLoaded = 0;
const totalTiles = Object.keys(TILE_PATHS).length;

for (const [key, path] of Object.entries(TILE_PATHS)) {
  const img = new Image();
  img.src = path;
  img.onload = () => { tiles[key] = img; tilesLoaded++; };
  img.onerror = () => { tilesLoaded++; };
}

function allTilesReady() { return tilesLoaded >= totalTiles; }

// ═══════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════
let running = false;
let gameOver = false;
let gameJustOver = false;  // flag to render game-over overlay exactly once

// Player
let playerX = CANVAS_W / 2;
let baseSpeed = PLAYER_BASE_SPEED;
let currentSpeed = PLAYER_BASE_SPEED;
let steerDir = 0;          // -1 = left, 0 = none, 1 = right
let steerSpeed = PLAYER_STEER_SPEED;      // horizontal movement speed
let playerFrame = 0;       // 0 or 1 for animation
let playerFrameTimer = 0;
let wHeld = false;
let sHeld = false;

// Terrain
const GRID_COLS = Math.ceil(CANVAS_W / TILE) + 6;
const TERRAIN_WIDTH_SCALE = 1.5; // 50% wider navigable terrain (kept for reference)
const GRID_ROWS = Math.ceil(CANVAS_H / TILE) + 6;
const TERRAIN_MIN_X = -TILE * 6;   // left navigable boundary (terrain space)
const TERRAIN_MAX_X = CANVAS_W + TILE * 6; // right navigable boundary (terrain space)
let terrainGrid = [];       // 2D array of tile keys
let terrainScrollY = 0;     // fractional scroll offset
let terrainScrollX = 0;     // fractional lateral scroll offset

// Obstacles
let obstacles = [];

// Yeti
let yetiActive = false;
let yetiX = 0, yetiY = 0;
let yetiDX = 0, yetiDY = 0;
let yetiFrame = 0;
let yetiFrameTimer = 0;

// Score
let score = 0;
let distance = 0;
let snowballsCollected = 0;

// Particles (snow spray)
let particles = [];



// Boundary markers (scroll with terrain, placed at screen edges)
let boundaryMarkers = [];
let lastBoundaryInterval = 0; // track last 20m interval to avoid duplicates

// ═══════════════════════════════════════════════════════════
//  TERRAIN
// ═══════════════════════════════════════════════════════════
const TERRAIN_TILES = ['snowA','snowB','iceA','snowC','snowD','iceB'];

function randomTerrainTile() {
  const r = Math.random();
  if (r < 0.25) return 'snowA';
  if (r < 0.45) return 'snowB';
  if (r < 0.55) return 'iceA';
  if (r < 0.70) return 'snowC';
  if (r < 0.82) return 'snowD';
  return 'iceB';
}

function initTerrain() {
  terrainGrid = [];
  for (let y = 0; y < GRID_ROWS; y++) {
    terrainGrid[y] = [];
    for (let x = 0; x < GRID_COLS; x++) {
      terrainGrid[y][x] = randomTerrainTile();
    }
  }
  terrainScrollY = 0;
  terrainScrollX = 0;
}

// ═══════════════════════════════════════════════════════════
//  OBSTACLE TYPES
// ═══════════════════════════════════════════════════════════
const OBSTACLE_TYPES = [
  { key: 'stumpA',  weight: 30 },
  { key: 'bushA',   weight: 15 },
  { key: 'bushB',   weight: 10 },
  { key: 'bushC',   weight: 10 },
  { key: 'snowman', weight: 10 },
  { key: 'rock',    weight: 25 },
];

function pickObstacleType() {
  const total = OBSTACLE_TYPES.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const t of OBSTACLE_TYPES) {
    r -= t.weight;
    if (r <= 0) return t.key;
  }
  // Fallback: should never reach here since weights sum to 100 and Math.random() < 1
  return OBSTACLE_TYPES[OBSTACLE_TYPES.length - 1].key;
}

function spawnObstacle() {
  const type = pickObstacleType();
  // Spawn across the full navigable terrain bounds (TERRAIN_MIN_X to TERRAIN_MAX_X)
  // so obstacles can appear at the left/right edges where the player can reach.
  const halfDraw = (TILE + 2) / 2;
  const minX = TERRAIN_MIN_X + halfDraw;
  const maxX = TERRAIN_MAX_X - halfDraw;
  const x = minX + Math.random() * (maxX - minX);
  obstacles.push({
    x,
    y: CANVAS_H + TILE * 2,
    type,
    w: TILE,
    h: TILE,
  });
}

// ═══════════════════════════════════════════════════════════
//  SKI TRAIL
// ═══════════════════════════════════════════════════════════
const skiTrail = new Map(); // "gx,gy" -> opacity (0-1)

function updateSkiTrail() {
  // Fade trail over time
  for (const [key, val] of skiTrail) {
    skiTrail.set(key, val - 0.005);
    if (val - 0.005 <= 0) skiTrail.delete(key);
  }
  // Clean up trail entries that are off-screen to prevent unbounded growth
  const margin = 5;
  for (const [key, val] of skiTrail) {
    if (val <= 0) continue;
    const [gx, gy] = key.split(',').map(Number);
    const sx = gx * TILE + terrainScrollX;
    // Trail world Y is stored as distance-based tile row; screen Y = PLAYER_Y - (totalScroll - trailWorldY)
    const sy = PLAYER_Y - (distance * PPM - gy * TILE);
    if (sx < -TILE * margin || sx > CANVAS_W + TILE * margin ||
        sy < -TILE * margin || sy > CANVAS_H + TILE * margin) {
      skiTrail.delete(key);
    }
  }
}

function drawSkiTrail() {
  for (const [key, alpha] of skiTrail) {
    if (alpha <= 0) continue;
    const [gx, gy] = key.split(',').map(Number);
    // Convert world-space trail coords to screen-space.
    // gy is stored as a tile-row at creation time (world-space Y = gy * TILE).
    // Screen Y = PLAYER_Y minus how far the player has traveled since creation.
    const sx = gx * TILE + terrainScrollX;
    const sy = PLAYER_Y - (distance * PPM - gy * TILE);
    // Only draw if on screen
    if (sx > -TILE && sx < CANVAS_W && sy > -TILE && sy < CANVAS_H) {
      ctx.fillStyle = `rgba(160,195,230,${alpha * 0.5})`;
      ctx.fillRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════════
function spawnParticles(x, y, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 3 - 1,
      alpha: 1,
      size: 2 + Math.random() * 3,
    });
  }
}

// ═══════════════════════════════════════════════════════════
//  INIT / RESET
// ═══════════════════════════════════════════════════════════
function initGame() {
  playerX = CANVAS_W / 2;
  baseSpeed = PLAYER_BASE_SPEED;
  currentSpeed = PLAYER_BASE_SPEED;
  steerDir = 0;
  wHeld = false;
  sHeld = false;
  score = 0;
  distance = 0;
  snowballsCollected = 0;
  obstacles = [];
  particles = [];
  terrainScrollY = 0;
  terrainScrollX = 0;
  yetiActive = false;
  gameOver = false;
  gameJustOver = false;
  playerFrame = 0;
  yetiFrame = 0;
  skiTrail.clear();
  boundaryMarkers = [];
  lastBoundaryInterval = 0;
  initTerrain();

  // Pre-place some obstacles so the screen isn't empty (increased 50%)
  // Use full navigable terrain bounds so pre-placed obstacles also cover edges.
  const halfDraw = (TILE + 2) / 2;
  const preMinX = TERRAIN_MIN_X + halfDraw;
  const preMaxX = TERRAIN_MAX_X - halfDraw;
  for (let i = 0; i < 23; i++) {
    const type = pickObstacleType();
    obstacles.push({
      x: preMinX + Math.random() * (preMaxX - preMinX),
      y: Math.random() * CANVAS_H,
      type,
      w: TILE,
      h: TILE,
    });
  }

  overlay.style.display = 'none';
}

// ═══════════════════════════════════════════════════════════
//  COLLISION
// ═══════════════════════════════════════════════════════════
function circleCollision(ax, ay, ar, bx, by, br) {
  const dx = ax - bx;
  const dy = ay - by;
  return (dx * dx + dy * dy) < (ar + br) * (ar + br);
}

function checkPlayerCollision() {
  // Player is always at screen center (tile center = playerScreenX - TILE/2 + TILE/2 = playerScreenX)
  const playerScreenX = CANVAS_W / 2;
  const margin = TILE * 2; // extra margin for collision check
  for (const o of obstacles) {
    // Skip obstacles far off-screen
    if (o.y < -TILE * 3 || o.y > CANVAS_H + TILE * 3) continue;
    // Obstacle tile center = renderTopLeft + TILE/2 = (o.x + terrainScrollX - TILE/2) + TILE/2 = o.x + terrainScrollX
    const obsCenterX = o.x + terrainScrollX;
    const obsCenterY = o.y;
    if (circleCollision(playerScreenX, PLAYER_Y, PLAYER_RADIUS, obsCenterX, obsCenterY, OBSTACLE_RADIUS)) {
      return 'obstacle';
    }
  }
  if (yetiActive) {
    // Yeti tile center = yetiX + terrainScrollX
    const yetiCenterX = yetiX + terrainScrollX;
    const yetiCenterY = yetiY;
    if (circleCollision(playerScreenX, PLAYER_Y, PLAYER_RADIUS, yetiCenterX, yetiCenterY, YETI_RADIUS)) {
      return 'yeti';
    }
  }

  return null;
}

// ═══════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════
function update() {
  if (gameOver || !running) return;

  // ── Gradual speed decrease (W held or gamepad slow) ──
  if (wHeld && currentSpeed > PLAYER_MIN_SPEED) {
    if (gamepadConnected && gamepadSlow) {
      // Gamepad slow down: scale by stick deflection beyond threshold
      // stickY is negative when pushed up; at threshold (-0.5) slowAmount = 1,
      // at full deflection (-1.0) slowAmount = 2x for faster deceleration
      const slowAmount = Math.max(1, Math.abs(stickY + GAMEPAD_SLOW_THRESHOLD) / (1 - GAMEPAD_SLOW_THRESHOLD));
      currentSpeed -= PLAYER_SPEED_RAMP * slowAmount * GAMEPAD_SPEED_RAMP_SCALE;
    } else {
      // Keyboard slow down: use base rate without gamepad scaling
      currentSpeed -= PLAYER_SPEED_RAMP;
    }
  }

  // ── Gradual speed increase (S held or gamepad speed) ──
  if (sHeld && currentSpeed < PLAYER_MAX_SPEED) {
    if (gamepadConnected && gamepadSpeed) {
      // Gamepad speed up: scale by stick deflection beyond threshold
      // stickY is positive when pushed down; at threshold (0.5) speedAmount = 1,
      // at full deflection (1.0) speedAmount = 2x for faster acceleration
      const speedAmount = Math.max(1, (stickY - GAMEPAD_SPEED_THRESHOLD) / (1 - GAMEPAD_SPEED_THRESHOLD));
      currentSpeed += PLAYER_SPEED_RAMP * speedAmount * GAMEPAD_SPEED_RAMP_SCALE;
    } else {
      // Keyboard speed up: use base rate without gamepad scaling
      currentSpeed += PLAYER_SPEED_RAMP;
    }
  }

  // Keyboard input debugging
  if (keysDown['w'] || keysDown['s']) {
    console.log('Input Debug:', { wPressed: keysDown['w'], sPressed: keysDown['s'], wHeld, sHeld });
  }

  // ── Speed returns to base when no speed input active ──
  if (!wHeld && !sHeld) {
    if (currentSpeed > baseSpeed) currentSpeed -= PLAYER_SPEED_RAMP * 2.5;
    if (currentSpeed < baseSpeed) currentSpeed += PLAYER_SPEED_RAMP * 2.5;
    if (Math.abs(currentSpeed - baseSpeed) < 0.05) currentSpeed = baseSpeed;
  }

  // Debug: Check speed changes
  if (wHeld || sHeld) {
    console.log('Speed adjustment:', { wHeld, sHeld, currentSpeed });
  }

  // Ensure keyboard controls are working properly
  if (keysDown['w'] && !wHeld) {
    console.log('W key pressed but wHeld not set!');
  }
  if (keysDown['s'] && !sHeld) {
    console.log('S key pressed but sHeld not set!');
  }



  // ── Lateral movement while steering (A or D held) ──
  // Forward speed is independent of steering direction
  // (steerSpeed is applied below to playerX, not to currentSpeed)

  // ── Distance & score ──
  // currentSpeed is in px/frame; divide by PPM to get meters/frame
  distance += currentSpeed / PPM;
  score = Math.floor(distance) + snowballsCollected * 10;

  // ── Yeti activation ──
  if (!yetiActive && distance >= YETI_THRESHOLD) {
    yetiActive = true;
    // Spawn yeti above the screen across the full navigable terrain width
    const yetiSpawnMin = TERRAIN_MIN_X + TILE;
    const yetiSpawnMax = TERRAIN_MAX_X - TILE;
    yetiX = yetiSpawnMin + Math.random() * (yetiSpawnMax - yetiSpawnMin);
    yetiY = -TILE * 4;
    yetiDX = 0;
    yetiDY = YETI_SPEED_BASE;
  }

  // ── Player animation ──
  playerFrameTimer++;
  if (playerFrameTimer > 8) {
    playerFrame = 1 - playerFrame;
    playerFrameTimer = 0;
  }

  // ── Yeti animation ──
  if (yetiActive) {
    yetiFrameTimer++;
    if (yetiFrameTimer > 10) {
      yetiFrame = (yetiFrame + 1) % 3;
      yetiFrameTimer = 0;
    }
  }

  // ── Terrain scroll (Y) ──
  terrainScrollY += currentSpeed;
  const rowsToScroll = Math.floor(terrainScrollY / TILE);
  if (rowsToScroll >= 1) {
    for (let i = 0; i < rowsToScroll; i++) {
      terrainGrid.shift();
      const newRow = [];
      for (let x = 0; x < GRID_COLS; x++) {
        newRow.push(randomTerrainTile());
      }
      terrainGrid.push(newRow);
    }
    terrainScrollY -= rowsToScroll * TILE;
  }

  // ── Move obstacles up (toward player) ──
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].y -= currentSpeed;
    if (obstacles[i].y < -TILE * 4) {
      obstacles.splice(i, 1);
    }
  }

  // ── Update boundary marker screen positions and remove off-screen ones ──
  for (let i = boundaryMarkers.length - 1; i >= 0; i--) {
    // Recalculate screen Y each frame so markers scroll up with the terrain
    boundaryMarkers[i].screenY = PLAYER_Y + (boundaryMarkers[i].worldY - distance * PPM);
    // Remove marker when it scrolls off the top of the screen
    if (boundaryMarkers[i].screenY < -TILE * 4) {
      boundaryMarkers.splice(i, 1);
    }
  }

  // ── Spawn new obstacles at bottom (increased 50%) ──
  const spawnRate = (0.015 + distance * 0.000005) * 1.5; // gets harder over time
  if (Math.random() < spawnRate) {
    spawnObstacle();
  }

  // ── Spawn boundary markers every 20m starting at 20m ──
  const currentInterval = Math.floor(distance / 20);
  if (currentInterval > lastBoundaryInterval) {
    // Spawn markers for each new interval at the bottom of the screen
    for (let interval = lastBoundaryInterval + 1; interval <= currentInterval; interval++) {
      // Place marker at the bottom of the screen so it scrolls up with the terrain
      const markerScreenY = CANVAS_H;
      boundaryMarkers.push({
        worldY: distance * PPM + CANVAS_H,
        screenY: markerScreenY,
        type: 'boundaryRight', // right edge marker
      });
      boundaryMarkers.push({
        worldY: distance * PPM + CANVAS_H,
        screenY: markerScreenY,
        type: 'boundaryLeft', // left edge marker
      });
    }
    lastBoundaryInterval = currentInterval;
  }

  // ── Player horizontal movement (relative to terrain) ──
  playerX += steerDir * steerSpeed;
  // Clamp player to expanded bounds (50% wider navigable terrain)
  // Player can move beyond screen edges for wider lateral range
  if (playerX < TERRAIN_MIN_X) playerX = TERRAIN_MIN_X;
  if (playerX > TERRAIN_MAX_X) playerX = TERRAIN_MAX_X;

  // ── Lateral scroll derived from player terrain position ──
  // Player stays centered on screen; terrainScrollX = -playerX + center offset
  terrainScrollX = -playerX + CANVAS_W / 2;

  // ── Record ski trail at player world-space position ──
  // Store trail at a world-space Y that increases as the player travels,
  // so each trail entry is at a unique world-space position and moves up
  // with the terrain, leaving a visible trail behind the player.
  {
    const trailGX = Math.floor(playerX / TILE);
    const trailGY = Math.floor(distance * PPM / TILE);
    const trailKey = `${trailGX},${trailGY}`;
    if (!skiTrail.has(trailKey)) {
      skiTrail.set(trailKey, 1.0); // opacity
    }
  }

  // ── Yeti chase logic ──
  if (yetiActive) {
    const dx = playerX - yetiX;
    const dy = PLAYER_Y - yetiY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0) {
      // Accelerate as yeti gets closer
      const chaseFactor = Math.min(YETI_SPEED_MAX / YETI_SPEED_BASE, dist / 150);
      const targetDX = (dx / dist) * YETI_SPEED_BASE * chaseFactor;
      const targetDY = (dy / dist) * YETI_SPEED_BASE * chaseFactor;

      // Smooth acceleration
      yetiDX += (targetDX - yetiDX) * 0.05;
      yetiDY += (targetDY - yetiDY) * 0.05;
    }

    // Obstacle avoidance for yeti
    let avoidDX = 0, avoidDY = 0;
    for (const o of obstacles) {
      const adx = yetiX - o.x;
      const ady = yetiY - o.y;
      const adist = Math.sqrt(adx * adx + ady * ady);
      if (adist < TILE * 2 && adist > 0) {
        const force = (TILE * 2 - adist) / (TILE * 2);
        avoidDX += (adx / adist) * force * 2;
        avoidDY += (ady / adist) * force * 2;
      }
    }

    yetiX += yetiDX + avoidDX * 0.5;
    yetiY += yetiDY + avoidDY * 0.5;

    // Keep yeti within the full navigable terrain bounds
    if (yetiX < TERRAIN_MIN_X) yetiX = TERRAIN_MIN_X;
    if (yetiX > TERRAIN_MAX_X) yetiX = TERRAIN_MAX_X;

    // If yeti goes off the top, respawn it across the full navigable terrain
    if (yetiY < -TILE * 6) {
      yetiY = -TILE * 4;
      const respawnMin = TERRAIN_MIN_X + TILE;
      const respawnMax = TERRAIN_MAX_X - TILE;
      yetiX = respawnMin + Math.random() * (respawnMax - respawnMin);
    }
  }

  // ── Collision check ──
  const hit = checkPlayerCollision();
  if (hit === 'obstacle' || hit === 'yeti' || hit === 'boundary') {
    gameOver = true;
    gameJustOver = true;
    running = false;  // stop the current game loop so it won't restart on its own
    spawnParticles(playerX, PLAYER_Y, 20);
  }

  // ── Update ski trail ──
  updateSkiTrail();

  // ── Particles ──
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.03;
    if (p.alpha <= 0) particles.splice(i, 1);
  }

  // ── Snow spray behind player (reduced density) ──
  if (Math.random() < 0.1) {
    const playerScreenX = playerX + terrainScrollX;
    spawnParticles(
      playerScreenX + (Math.random() - 0.5) * 6,
      PLAYER_Y + 4,
      1
    );
  }

  // ── Update HUD ──
  hudScore.textContent = score;
  hudDist.textContent = Math.floor(distance);
  // Show speed in km/h for the player
  hudSpeed.textContent = (currentSpeed * 60 / PPM * 3.6).toFixed(1);
}

// ═══════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════
function drawTile(key, sx, sy) {
  const img = tiles[key];
  if (img && img.width > 0) {
    ctx.drawImage(img, 0, 0, TILE, TILE, sx, sy, TILE, TILE);
  }
}

function render() {
  // ── Clear ──
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // ── Draw terrain ──
  const offsetX = terrainScrollX;
  const offsetY = terrainScrollY;

  const startCol = Math.floor(-offsetX / TILE) - 1;
  const startRow = Math.floor(-offsetY / TILE) - 1;
  const endCol   = startCol + Math.ceil(CANVAS_W / TILE) + 3;
  const endRow   = startRow + Math.ceil(CANVAS_H / TILE) + 3;

  for (let row = startRow; row < endRow; row++) {
    for (let col = startCol; col < endCol; col++) {
      const gx = col + GRID_COLS; // wrap positive
      const gy = row + GRID_ROWS;
      const tileKey = terrainGrid[(gy % GRID_ROWS)][(gx % GRID_COLS)];
      const sx = col * TILE + offsetX;
      const sy = row * TILE + offsetY;
      drawTile(tileKey, sx, sy);
    }
  }

  // ── Draw ski trail ──
  drawSkiTrail();

  // ── Draw obstacles (shifted by terrainScrollX for lateral movement) ──
  // Draw collision objects at 18x18 to avoid top-edge clipping on tree/stump sprites
  const OBSTACLE_DRAW_SIZE = TILE + 2;
  for (const o of obstacles) {
    const img = tiles[o.type];
    if (img && img.width > 0) {
      // Draw image centered, scaled to OBSTACLE_DRAW_SIZE to avoid top clipping
      const sx = o.x + terrainScrollX - OBSTACLE_DRAW_SIZE / 2;
      const sy = o.y - OBSTACLE_DRAW_SIZE / 2;
      ctx.drawImage(img, 0, 0, img.width, img.height, sx, sy, OBSTACLE_DRAW_SIZE, OBSTACLE_DRAW_SIZE);
    }
  }

  // ── Draw boundary markers at terrain edges ──
  for (const m of boundaryMarkers) {
    const img = tiles[m.type];
    if (img && img.width > 0) {
      // Use pre-calculated screen Y (updated each frame in update())
      const sy = m.screenY;
      if (m.type === 'boundaryRight') {
        // Right edge: place at the screen position of the right terrain boundary
        const sx = TERRAIN_MAX_X + terrainScrollX;
        ctx.drawImage(img, 0, 0, img.width, img.height, sx, sy, TILE, TILE);
      } else if (m.type === 'boundaryLeft') {
        // Left edge: place at the screen position of the left terrain boundary
        const sx = TERRAIN_MIN_X + terrainScrollX;
        ctx.drawImage(img, 0, 0, img.width, img.height, sx, sy, TILE, TILE);
      }
    }
  }

  // ── Draw yeti (shifted by terrainScrollX for lateral movement) ──
  if (yetiActive) {
    const yetiKeys = ['yetiA', 'yetiB', 'yetiC'];
    const yetiImg = tiles[yetiKeys[yetiFrame]];
    if (yetiImg && yetiImg.width > 0) {
      const sx = yetiX + terrainScrollX - OBSTACLE_DRAW_SIZE / 2;
      const sy = yetiY - OBSTACLE_DRAW_SIZE / 2;
      ctx.drawImage(yetiImg, 0, 0, yetiImg.width, yetiImg.height, sx, sy, OBSTACLE_DRAW_SIZE, OBSTACLE_DRAW_SIZE);
    }
  }

  // ── Draw particles ──
  for (const p of particles) {
    ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }

  // ── Draw player (screen position = playerX + terrainScrollX) ──
  if (!gameOver) {
    const playerKeys = ['playerA', 'playerB'];
    const playerScreenX = playerX + terrainScrollX;
    const playerImg = tiles[playerKeys[playerFrame]];
    if (playerImg && playerImg.width > 0) {
      // Draw player at its native size, centered on screen
      const sx = playerScreenX - playerImg.width / 2;
      const sy = PLAYER_Y - playerImg.height / 2;
      ctx.drawImage(playerImg, 0, 0, playerImg.width, playerImg.height, sx, sy, playerImg.width, playerImg.height);
    }
  }

  // ── Game over overlay (render once) ──
  if (gameOver && gameJustOver) {
    gameJustOver = false;
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h2>💥 Game Over!</h2>
      <p>You made it <strong>${Math.floor(distance)}m</strong>.<br/>
         Final score: <strong>${score}</strong></p>
      <div class="btn-row"><button id="restart-btn">Ski Again</button></div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════
const keysDown = {};

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (keysDown[key]) return; // ignore repeat
  keysDown[key] = true;

  if (!running || gameOver) {
    startGame();
    return;
  }

  switch (key) {
    case 'w': wHeld = true; break;
    case 's': sHeld = true; break;
    case 'a': steerDir = -1; break;
    case 'd': steerDir =  1; break;
  }
  e.preventDefault();
});

window.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  keysDown[key] = false;

  if (!running || gameOver) return;

  switch (key) {
    case 'w': wHeld = false; break;
    case 's': sHeld = false; break;
    case 'a': if (steerDir === -1) steerDir = 0; break;
    case 'd': if (steerDir ===  1) steerDir = 0; break;
  }
});

// ═══════════════════════════════════════════════════════════
//  GAMEPAD INPUT
// ═══════════════════════════════════════════════════════════
const GAMEPAD_STICK_DEADZONE = 0.15;  // ignore small stick drift
const GAMEPAD_STEER_SCALE = 1.0;       // map full stick deflection to steerDir
const GAMEPAD_SLOW_THRESHOLD = -0.5;   // stick Y below this = slow down
const GAMEPAD_SPEED_THRESHOLD = 0.5;   // stick Y above this = speed up
const GAMEPAD_SPEED_RAMP_SCALE = 3.0;  // multiplier for stick deflection-based acceleration

let gamepadSlow = false;
let gamepadSpeed = false;
let gamepadSteer = 0;
let gamepadConnected = false;
let stickY = 0;  // module-level so update() can access it for acceleration scaling

function readGamepadInput() {
  // ── Gamepad button detection for start/restart (only when not running) ──
  // This runs independently of the game loop so it works on both the initial
  // start screen and the game-over screen.
  if (!running) {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gamepads.length; i++) {
      const gp = gamepads[i];
      if (!gp) continue;
      for (let j = 0; j < gp.buttons.length; j++) {
        if (gp.buttons[j] && gp.buttons[j].pressed) {
          startGame();
          return; // startGame() was called, stop processing
        }
      }
    }
  }

  // ── Gameplay input (only when game is actively running) ──
  if (!running || gameOver) return;

  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  let anyConnected = false;

  // Reset gamepad states every time we read input to prevent stale data from disconnected controllers
  gamepadSlow = false;
  gamepadSpeed = false;
  gamepadSteer = 0;

  for (let i = 0; i < gamepads.length; i++) {
    const gp = gamepads[i];
    if (!gp) continue;
    anyConnected = true;

    // ── Left stick (axis 0 = left/right, axis 1 = up/down) ──
    // Left stick Y-axis is always axis 1 per the Gamepad API spec.
    // Do NOT sum with axis 3 (right stick Y-axis) — that corrupts speed detection.
    const stickX = gp.axes[0] ?? 0;
    stickY = gp.axes[1] ?? 0;

    // Steering from left stick X
    if (Math.abs(stickX) > GAMEPAD_STICK_DEADZONE) {
      gamepadSteer = stickX > 0 ? GAMEPAD_STEER_SCALE : -GAMEPAD_STEER_SCALE;
    } else {
      gamepadSteer = 0;
    }

    // Steering from D-pad (axes 14/15 on some controllers)
    const dpadX = gp.axes[14] ?? 0;
    if (Math.abs(dpadX) > GAMEPAD_STICK_DEADZONE) {
      gamepadSteer = dpadX > 0 ? GAMEPAD_STEER_SCALE : -GAMEPAD_STEER_SCALE;
    }

    // Slow down from left stick up (negative Y = up)
    if (stickY < GAMEPAD_SLOW_THRESHOLD) {
      gamepadSlow = true;
    } else {
      gamepadSlow = false;
    }

    // Speed up from left stick down (positive Y = down)
    if (stickY > GAMEPAD_SPEED_THRESHOLD) {
      gamepadSpeed = true;
    } else {
      gamepadSpeed = false;
    }

    // ── D-pad buttons (standard Gamepad API button indices) ──
    // Button 12 = D-pad up, 13 = D-pad down, 14 = D-pad left, 15 = D-pad right
    // D-pad up/down only affects speed (slow/speed flags)
    if (gp.buttons[12] && gp.buttons[12].pressed) {
      gamepadSlow = true;
      gamepadSpeed = false;  // D-pad up cancels any stick-based speed-up
    }
    if (gp.buttons[13] && gp.buttons[13].pressed) {
      gamepadSpeed = true;
      gamepadSlow = false;  // D-pad down cancels any stick-based slow-down
    }
    // D-pad left/right only affects steering (overwrites stick steering when active)
    if (gp.buttons[14] && gp.buttons[14].pressed) {
      gamepadSteer = -GAMEPAD_STEER_SCALE;
    }
    if (gp.buttons[15] && gp.buttons[15].pressed) {
      gamepadSteer = GAMEPAD_STEER_SCALE;
    }

    // ── D-pad buttons (Nintendo-style mapping: buttons 16-19) ──
    // Switch Pro Controller and some other controllers map D-pad to buttons 16-19
    if (gp.buttons[16] && gp.buttons[16].pressed) {
      gamepadSlow = true;
      gamepadSpeed = false;  // D-pad up cancels any stick-based speed-up
    }
    if (gp.buttons[17] && gp.buttons[17].pressed) {
      gamepadSpeed = true;
      gamepadSlow = false;  // D-pad down cancels any stick-based slow-down
    }
    if (gp.buttons[18] && gp.buttons[18].pressed) {
      gamepadSteer = -GAMEPAD_STEER_SCALE;
    }
    if (gp.buttons[19] && gp.buttons[19].pressed) {
      gamepadSteer = GAMEPAD_STEER_SCALE;
    }
  }

  gamepadConnected = anyConnected;
}

function applyGamepadInput() {
  // Note: We no longer early-return if !running so that gamepad button presses 
  // are still detected during the menu/gameover states to allow starting/restarting.

  // Merge gamepad input with keyboard input (OR logic — either source can activate)
  // Speed: true when keyboard key OR gamepad input is active
  wHeld = keysDown['w'] || gamepadSlow;
  sHeld = keysDown['s'] || gamepadSpeed;

  // Steering: gamepad takes priority when active; otherwise keyboard manages steerDir
  if (gamepadSteer !== 0) {
    steerDir = gamepadSteer;
  } else if (!keysDown['a'] && !keysDown['d']) {
    // Gamepad idle and keyboard idle → clear steering
    steerDir = 0;
  }
  // If gamepad idle but keyboard A/D held, keep steerDir from keyboard handler
}

function inputLoop() {
  readGamepadInput();
  applyGamepadInput();
  requestAnimationFrame(inputLoop);
}

// Ensure keyboard inputs are properly handled for debugging
// Debugging functions removed for cleanliness.

// ═══════════════════════════════════════════════════════════
//  GAMEPAD INPUT HANDLING
// ═══════════════════════════════════════════════════════════
function handleGamepadInput() {
  // This function ensures that gamepad and keyboard inputs work properly together
  // It's called from readGamepadInput to maintain proper state updates
}

// ═══════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════
function gameLoop() {
  // Note: readGamepadInput() and applyGamepadInput() are called by inputLoop()
  // which runs continuously. We do NOT duplicate them here to avoid double-
  // processing gamepad state each frame.

  update();
  render();
  if (running) requestAnimationFrame(gameLoop);
}

function startGame() {
  // Cancel any lingering animation frame from a previous game session
  running = false;
  initGame();
  running = true;
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════════
document.getElementById('start-btn').addEventListener('click', startGame);

// Use event delegation on overlay so the restart button works after innerHTML replacement
overlay.addEventListener('click', (e) => {
  if (e.target.id === 'restart-btn' && gameOver) startGame();
});

// ═══════════════════════════════════════════════════════════
//  SCALING & FULLSCREEN
// ═══════════════════════════════════════════════════════════
const gameWrap = document.getElementById('game-wrap');
const fullscreenBtn = document.getElementById('fullscreen-btn');
let currentScale = null;

// ── Scale the game to fit the viewport, preserving aspect ratio ──
function updateGameScale() {
  // Guard: when fullscreen is active, the element IS the viewport.
  // Recalculating scale here causes a feedback loop because the browser
  // uses the element's pre-transform dimensions as the fullscreen size.
  if (document.fullscreenElement) return;

  const targetW = CANVAS_W;
  const targetH = CANVAS_H;
  const scaleX = document.documentElement.clientWidth / targetW;
  const scaleY = document.documentElement.clientHeight / targetH;
  const scale = Math.min(scaleX, scaleY);

  if (scale !== currentScale) {
    currentScale = scale;
    gameWrap.style.transform = `scale(${scale})`;
  }
}

// ── Sync fullscreen button visibility ──
function syncFullscreenUI() {
  const supported = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  if (!supported) {
    fullscreenBtn.classList.add('hidden');
    return;
  }
  fullscreenBtn.classList.remove('hidden');
  fullscreenBtn.textContent = document.fullscreenElement ? '[Exit FS]' : '[FS]';
}

// ── Toggle fullscreen on #game-wrap ──
function toggleFullscreen() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const el = gameWrap;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) {
      fn.call(el).catch(() => {
        // Silently fail — user may have cancelled
      });
    }
  } else {
    const fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn) fn.call(document);
  }
}

// ── Fullscreen change listener ──
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('fullscreen-active', !!document.fullscreenElement);
  syncFullscreenUI();
  updateGameScale();
});

// ── Fullscreen error handler (cleanup on failure) ──
document.addEventListener('fullscreenerror', () => {
  document.body.classList.remove('fullscreen-active');
  syncFullscreenUI();
});

// ── Also handle webkit prefix for Safari ──
document.addEventListener('webkitfullscreenchange', () => {
  document.body.classList.toggle('fullscreen-active', !!document.webkitFullscreenElement);
  syncFullscreenUI();
  updateGameScale();
});

document.addEventListener('webkitfullscreenerror', () => {
  document.body.classList.remove('fullscreen-active');
  syncFullscreenUI();
});

// ── Bind button click ──
fullscreenBtn.addEventListener('click', toggleFullscreen);

// ── Debounced resize handler via rAF ──
let resizeRafId = null;
window.addEventListener('resize', () => {
  if (resizeRafId) return;          // already pending
  resizeRafId = requestAnimationFrame(() => {
    resizeRafId = null;
    updateGameScale();
  });
});

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
window.addEventListener('load', () => {
  function waitForTiles() {
    if (allTilesReady()) {
      initTerrain();
      render();
    } else {
      setTimeout(waitForTiles, 50);
    }
  }
  waitForTiles();
  inputLoop();
  updateGameScale();
  syncFullscreenUI();
});
</script>
